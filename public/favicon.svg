<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
    <title id="title">Splitter</title>
    <desc id="description">Stylizowana litera S symbolizująca podział rozliczeń</desc>
    <defs>
        <linearGradient id="accent" x1="116" y1="92" x2="396" y2="420" gradientUnits="userSpaceOnUse">
            <stop stop-color="#99f6e4"/>
            <stop offset="0.5" stop-color="#5eead4"/>
            <stop offset="1" stop-color="#14b8a6"/>
        </linearGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
            <feGaussianBlur stdDeviation="10" result="blur"/>
            <feMerge>
                <feMergeNode in="blur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="512" height="512" rx="116" fill="#0b1017"/>
    <rect x="18" y="18" width="476" height="476" rx="100" fill="none" stroke="#1e293b" stroke-width="4"/>
    <path d="M363 142c-29-25-67-38-111-38-69 0-116 35-116 87 0 48 36 71 108 88 53 13 76 26 76 53 0 27-27 45-69 45-42 0-78-18-109-48" fill="none" stroke="url(#accent)" stroke-linecap="round" stroke-linejoin="round" stroke-width="48" filter="url(#glow)"/>
    <path d="M177 370 343 142" fill="none" stroke="#0b1017" stroke-linecap="round" stroke-width="22"/>
    <circle cx="382" cy="371" r="17" fill="#fb7185"/>
</svg>
